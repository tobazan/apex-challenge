name: SAAS Data Pipeline CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  lint-and-test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17 (Required for PySpark 3.5)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install uv and set up Python 3.11
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run Ruff Linter (PEP8)
        run: uv run ruff check src/ tests/

      - name: Run Unit Tests with Pytest
        run: uv run pytest -v