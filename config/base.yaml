project:
  name: "saas-medallion-pipeline"

runtime: "filesystem" # Overridden via CLI --runtime [filesystem|databricks]
environment: "dev"    # Overridden via CLI --env [dev|qa|main]

execution:
  start_date: "2025-01-01"
  end_date: "2025-06-30"
  tenant: "all"
  fail_fast: false

quality:
  fail_on_critical: false

registered_tenants:
  - sv
  - hn
  - ec
  - jm
  - gt
  - pe

rules:
  cs_to_st_factor: 20
  routine_delivery_types: ["ZPRE", "ZVE1"]
  bonus_delivery_types: ["Z04", "Z05"]

storage:
  filesystem:
    raw_root: "data/raw"
    env_root: "data/${environment}"
    raw_deliveries: "${storage.filesystem.raw_root}/deliveries"
    raw_materials: "${storage.filesystem.raw_root}/materials"
    checkpoints: "${storage.filesystem.env_root}/_checkpoints"
    targets:
      shared:
        quality_logs: "${storage.filesystem.env_root}/shared/quality_logs"
        bronze_materials: "${storage.filesystem.env_root}/bronze/shared/materials_catalog"
        silver_materials: "${storage.filesystem.env_root}/silver/shared/dim_materials"
        quarantine_materials: "${storage.filesystem.env_root}/silver_quarantine/shared/dim_materials"
      tenant:
        bronze_deliveries: "${storage.filesystem.env_root}/bronze/{tenant}/deliveries"
        silver_deliveries: "${storage.filesystem.env_root}/silver/{tenant}/fact_deliveries"
        quarantine_deliveries: "${storage.filesystem.env_root}/silver_quarantine/{tenant}/fact_deliveries"
        gold_daily_metrics: "${storage.filesystem.env_root}/gold/{tenant}/daily_metrics_by_delivery_type"

